<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f6f1e7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>今天</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="phone">
    <!-- ============ 今天 ============ -->
    <main id="view-today" class="view active">
      <header class="today-head">
        <div class="today-date" id="todayDate">2026年9月4日</div>
        <div class="today-week" id="todayWeek">星期五</div>
        <div class="today-term" id="todayTerm">白露 · 秋</div>
        <div class="today-term-note" id="todayTermNote">草木渐收，天气转凉。</div>
      </header>

      <section class="ask">
        <h1 class="ask-title">今天，想留下什么？</h1>

        <button class="big-record" id="bigRecord" aria-label="记一下">
          <span class="big-record-plus">＋</span>
          <span class="big-record-text">记一下</span>
          <span class="big-record-hint" id="bigRecordHint">长按说话 · 点击写下</span>
        </button>

        <div class="quick-grid">
          <button class="quick" data-type="voice"><span>🎙</span>说一句</button>
          <button class="quick" data-type="photo"><span>📷</span>拍一张</button>
          <button class="quick" data-type="dream"><span>🌙</span>记个梦</button>
          <button class="quick" data-type="text"><span>✍️</span>写一句</button>
        </div>
      </section>

      <section class="timeline-sec">
        <h2 class="sec-title" id="timelineTitle">今天已经留下</h2>
        <div id="timeline" class="timeline"></div>
      </section>

      <section class="tree-teaser" id="treeTeaser">
        <span class="tree-teaser-emoji" id="treeTeaserEmoji">🌱</span>
        <span class="tree-teaser-text" id="treeTeaserText">你的树在等一片新叶</span>
        <span class="tree-teaser-arrow">›</span>
      </section>

      <section class="question">
        <div class="question-label">🌿 今日一问</div>
        <p class="question-text" id="questionText">你现在正在经历人生的什么季节？</p>
        <button class="question-answer" id="questionAnswer">顺手说一句 ›</button>
      </section>

      <div class="bottom-space"></div>
    </main>

    <!-- ============ 我的树 ============ -->
    <main id="view-tree" class="view view-tree">
      <header class="tree-bar">
        <button type="button" class="tree-bar-btn" id="treeBack" aria-label="返回">‹</button>
        <div class="tree-bar-mid">
          <h1>我的树</h1>
          <p id="treeYearLabel">2026</p>
        </div>
        <button type="button" class="tree-bar-link" id="treeToYear">这一年</button>
      </header>
      <p class="tree-lead" id="treeLead"></p>
      <div class="tree-canvas">
        <svg id="treeSvg" viewBox="0 0 360 540" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="tree-replay-label" id="treeReplayLabel" hidden></div>
      </div>
      <div class="tree-axis" id="treeAxis" hidden>
        <div class="tree-axis-date" id="treeAxisDate">2026年1月1日</div>
        <div class="tree-axis-track">
          <div class="tree-axis-months" id="treeAxisMonths"></div>
          <div class="tree-axis-needle" id="treeAxisNeedle"></div>
        </div>
      </div>
      <footer class="tree-foot">
        <div class="tree-years" id="treeYears"></div>
        <p class="tree-days" id="treeDays"></p>
        <div class="tree-foot-actions">
          <button type="button" class="tree-primary" id="treeCapture">记下今天</button>
          <button type="button" class="tree-text-btn" id="treeReplay">看它怎么长出来</button>
          <button type="button" class="tree-text-btn" id="treeDemo">填入一年的演示</button>
          <button type="button" class="tree-text-btn" id="treeRecords">查看这一年的记录</button>
        </div>
      </footer>
    </main>

    <!-- ============ 梦境 ============ -->
    <main id="view-dream" class="view">
      <header class="page-head">
        <h1>梦境</h1>
        <p>醒来之前，先把它留下来。</p>
      </header>
      <div id="dreamList" class="dream-list"></div>
      <div class="bottom-space"></div>
    </main>

    <!-- ============ 我的一年 · 生命日历 ============ -->
    <main id="view-year" class="view view-cal">
      <div class="cal-stage" id="calStage">
        <article class="cal-page" id="calPage"></article>
      </div>
      <div class="cal-flip">
        <button class="cal-flip-btn" id="calPrev" aria-label="上一页">‹</button>
        <div class="cal-flip-mid">
          <div class="cal-dots" id="calDots"></div>
          <div class="cal-flip-hint" id="calFlipHint">翻一页</div>
        </div>
        <button class="cal-flip-btn" id="calNext" aria-label="下一页">›</button>
      </div>
    </main>

    <!-- ============ 底部导航 ============ -->
    <nav class="tabbar">
      <button class="tab active" data-view="today"><span>🏠</span>今天</button>
      <button class="tab" data-view="tree"><span>🌳</span>我的树</button>
      <button class="tab" data-view="dream"><span>🌙</span>梦境</button>
      <button class="tab" data-view="year"><span>📅</span>我的一年</button>
    </nav>

    <!-- ============ 记一下：万能捕捉器（全屏） ============ -->
    <section class="capture" id="capture">
      <button class="capture-close" id="captureClose" aria-label="关闭">×</button>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden />

      <!-- 状态 1：直接写 / 直接说 -->
      <div class="cap-pane" data-pane="input">
        <h1 class="cap-title">此刻，想留下什么？</h1>
        <textarea id="capText" class="cap-text" placeholder="写下此刻……" rows="6"></textarea>
        <button class="cap-voice" id="capVoice">
          <span class="cap-voice-icon">🎙</span>
          <span class="cap-voice-label" id="capVoiceLabel">按住说一说</span>
        </button>
        <div class="cap-live" id="capLive"></div>
        <div class="cap-quick">
          <button class="cap-quick-btn" data-mode="photo"><span>📷</span>照片</button>
          <button class="cap-quick-btn" data-mode="dream"><span>🌙</span>梦境</button>
          <button class="cap-quick-btn" data-mode="mood"><span>😊</span>心情</button>
        </div>
        <div class="cap-foot">
          <button class="cap-primary" id="capDone">完成</button>
        </div>
      </div>

      <!-- 状态 2：照片 -->
      <div class="cap-pane" data-pane="photo">
        <div class="cap-photo-wrap"><img id="capPhotoImg" alt="" /></div>
        <p class="cap-sub">想给这张照片留句话吗？</p>
        <textarea id="capPhotoText" class="cap-text cap-text-sm" placeholder="不写也可以" rows="2"></textarea>
        <div class="cap-foot">
          <button class="cap-link" id="capPhotoRetake">换一张</button>
          <button class="cap-primary" id="capPhotoSave">留下</button>
        </div>
      </div>

      <!-- 状态 3：梦境 -->
      <div class="cap-pane" data-pane="dream">
        <h1 class="cap-title">还记得刚才的梦吗？</h1>
        <p class="cap-sub">不用想完整。<br/>想起什么，就说什么。</p>
        <textarea id="capDreamText" class="cap-text" placeholder="梦见……" rows="5"></textarea>
        <button class="cap-voice cap-voice-dream" id="capDreamVoice">
          <span class="cap-voice-icon">🎙</span>
          <span class="cap-voice-label" id="capDreamVoiceLabel">按住说一说</span>
        </button>
        <div class="cap-live" id="capDreamLive"></div>
        <div class="cap-foot">
          <button class="cap-primary" id="capDreamDone">完成</button>
        </div>
      </div>

      <!-- 状态 4：心情 -->
      <div class="cap-pane" data-pane="mood">
        <h1 class="cap-title">😊 此刻是什么感觉？</h1>
        <div class="cap-moods" id="capMoods"></div>
        <textarea id="capMoodText" class="cap-text cap-text-sm" placeholder="想多说一句吗？不说也可以。" rows="2"></textarea>
        <div class="cap-foot">
          <button class="cap-primary" id="capMoodSave" disabled>留下</button>
        </div>
      </div>

      <!-- 状态 5：记录完成卡（原始的我 + AI 轻轻整理后的我） -->
      <div class="cap-pane" data-pane="card">
        <div class="card" id="cardBox"></div>
        <div class="review-chat" id="cardChat"></div>
        <div class="card-status">
          <div class="card-status-main">✓ 已经替你留下</div>
          <div class="card-status-sub" id="cardFuture"></div>
        </div>
        <div class="card-tools">
          <button class="cap-link" id="cardEdit">改一改</button>
          <span class="dot">·</span>
          <button class="cap-link" id="cardNoLink">不关联这条记录</button>
          <span class="dot">·</span>
          <button class="cap-link" id="cardMute">不希望 AI 分析这类内容</button>
        </div>
        <div class="cap-foot">
          <button class="cap-primary" id="cardAgain">继续记一下</button>
          <button class="cap-link" id="cardHome">回到今天</button>
        </div>
      </div>
    </section>

    <!-- ============ 树上的记忆卡片 ============ -->
    <div class="sheet-mask" id="memSheet">
      <div class="sheet mem-sheet">
        <div class="sheet-handle"></div>
        <div id="memBody"></div>
        <button type="button" class="cap-link" id="memClose">收起</button>
      </div>
    </div>

    <!-- ============ 某一天 ============ -->
    <div class="sheet-mask" id="daySheet">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title" id="daySheetTitle">这一天</h3>
        <p class="day-sheet-term" id="daySheetTerm"></p>
        <div id="daySheetList" class="timeline"></div>
        <div class="detail-actions">
          <button class="detail-close" id="daySheetClose">收起</button>
        </div>
      </div>
    </div>

    <!-- ============ 记录详情 ============ -->
    <div class="sheet-mask" id="detailSheet">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="card card-in-sheet" id="detailCard"></div>
        <div class="detail-actions">
          <button class="detail-delete" id="detailDelete">删掉这一条</button>
          <button class="detail-close" id="detailClose">收起</button>
        </div>
      </div>
    </div>

    <!-- ============ 长按录音浮层 ============ -->
    <div class="voice-overlay" id="voiceOverlay">
      <div class="voice-pulse"></div>
      <div class="voice-hint" id="voiceHint">正在听……松开完成</div>
      <div class="voice-live" id="voiceLive"></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
